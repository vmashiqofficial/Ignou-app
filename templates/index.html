<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IGNOU PDF Generator</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; text-align: center; padding: 50px; }
        .card { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; display: block; width: 100%; }
        button { background: #1e3a8a; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>IGNOU Attendance & Absentee Sheet Generator</h2>
        <p>Upload your master input Excel (.xlsx) or CSV file below:</p>
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".xlsx,.xls,.csv" required>
            <button type="submit">Process and Generate PDFs</button>
        </form>
    </div>
</body>
</html>
